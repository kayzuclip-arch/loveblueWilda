
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>

  <canvas id="heart"></canvas>

  <!-- Musik otomatis -->
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <script>
    // MUSIK
    const music = document.getElementById("bgMusic");
    music.volume = 0.5;

    function startMusic() {
      music.play().catch(() => {});
    }

    window.addEventListener("load", startMusic);
    document.addEventListener("click", startMusic, { once: true });
    document.addEventListener("touchstart", startMusic, { once: true });

    // ANIMASI HATI
    window.requestAnimationFrame =
      window.requestAnimationFrame ||
      window.webkitRequestAnimationFrame ||
      function(callback) {
        return setTimeout(callback, 1000 / 60);
      };

    const isMobile =
      /android|webos|iphone|ipad|ipod/i.test(navigator.userAgent);

    let loaded = false;

    function init() {
      if (loaded) return;
      loaded = true;

      const canvas = document.getElementById("heart");
      const ctx = canvas.getContext("2d");

      const koef = isMobile ? 0.5 : 1;

      let width, height;

      function resize() {
        width = canvas.width = koef * innerWidth;
        height = canvas.height = koef * innerHeight;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, width, height);
      }

      resize();
      window.addEventListener("resize", resize);

      const rand = Math.random;

      function heartPosition(rad) {
        return [
          Math.pow(Math.sin(rad), 3),
          -(15 * Math.cos(rad)
            - 5 * Math.cos(2 * rad)
            - 2 * Math.cos(3 * rad)
            - Math.cos(4 * rad))
        ];
      }

      function scaleAndTranslate(pos, sx, sy, dx, dy) {
        return [
          dx + pos[0] * sx,
          dy + pos[1] * sy
        ];
      }

      const traceCount = isMobile ? 20 : 50;
      const dr = isMobile ? 0.3 : 0.1;
      const pointsOrigin = [];

      for (let i = 0; i < Math.PI * 2; i += dr)
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 310, 19, 0, 0));

      for (let i = 0; i < Math.PI * 2; i += dr)
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 250, 15, 0, 0));

      for (let i = 0; i < Math.PI * 2; i += dr)
        pointsOrigin.push(scaleAndTranslate(heartPosition(i), 190, 11, 0, 0));

      const heartPointsCount = pointsOrigin.length;
      const targetPoints = [];

      function pulse(kx, ky) {
        for (let i = 0; i < pointsOrigin.length; i++) {
          targetPoints[i] = [
            kx * pointsOrigin[i][0] + width / 2,
            ky * pointsOrigin[i][1] + height / 2.2
          ];
        }
      }

      const particles = [];

      for (let i = 0; i < heartPointsCount; i++) {
        const x = rand() * width;
        const y = rand() * height;

        particles[i] = {
          vx: 0,
          vy: 0,
          speed: rand() + 5,
          q: Math.floor(rand() * heartPointsCount),
          D: 2 * (i % 2) - 1,
          force: 0.2 * rand() + 0.7,
          color: "rgba(51, 204, 255, 0.7)",
          trace: Array.from(
            { length: traceCount },
            () => ({ x, y })
          )
        };
      }

      const config = {
        traceK: 0.4,
        timeDelta: 0.6
      };

      let time = 0;

      function loop() {
        const n = -Math.cos(time);

        pulse((1 + n) * 0.5, (1 + n) * 0.5);

        time +=
          (Math.sin(time) < 0 ? 9 : n > 0.8 ? 0.2 : 1)
          * config.timeDelta;

        ctx.fillStyle = "rgba(0,0,0,0.1)";
        ctx.fillRect(0, 0, width, height);

        for (let i = particles.length; i--;) {
          const u = particles[i];
          const q = targetPoints[u.q];

          const dx = u.trace[0].x - q[0];
          const dy = u.trace[0].y - q[1];

          const length = Math.sqrt(dx * dx + dy * dy) || 1;

          if (length < 10) {
            if (rand() > 0.95) {
              u.q = Math.floor(rand() * heartPointsCount);
            } else {
              if (rand() > 0.99) u.D *= -1;

              u.q = (u.q + u.D) % heartPointsCount;

              if (u.q < 0)
                u.q += heartPointsCount;
            }
          }

          u.vx += (-dx / length) * u.speed;
          u.vy += (-dy / length) * u.speed;

          u.trace[0].x += u.vx;
          u.trace[0].y += u.vy;

          u.vx *= u.force;
          u.vy *= u.force;

          for (let k = 0; k < u.trace.length - 1; k++) {
            const T = u.trace[k];
            const N = u.trace[k + 1];

            N.x -= config.traceK * (N.x - T.x);
            N.y -= config.traceK * (N.y - T.y);
          }

          ctx.fillStyle = u.color;

          u.trace.forEach(t => {
            ctx.fillRect(t.x, t.y, 1, 1);
          });
        }

        requestAnimationFrame(loop);
      }

      loop();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>

</body>
</html>
